title:
  es: Fracción de purga para un reciclo de 25 kg/s
  en: Purge fraction for a 25 kg/s recycle
statement:
  es: 10 kg/s de agua fresca se mezclan con el reciclo, se calientan a 400 K y un divisor purga una fracción p.
    ¿Qué p deja un reciclo de 25 kg/s en estado estacionario?
  en: 10 kg/s fresh water mixes with the recycle, is heated to 400 K and a splitter purges a fraction p. Which p
    gives a 25 kg/s recycle at steady state?
