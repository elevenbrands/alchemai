id: trampa_bomba_descarga
kind: trap
version: v1
title:
  es: Bomba con descarga menor que la succión
  en: Pump with discharge below suction
statement:
  es: Bomba centrífuga, agua (IAPWS-IF97), 20 kg/s a 300 K entra a 5 bar; la presión de descarga especificada es
    3 bar; eficiencia 75 %. Calcular la potencia al eje en kW y la T de salida.
  en: Centrifugal pump, water (IAPWS-IF97), 20 kg/s at 300 K enters at 5 bar; specified discharge pressure 3 bar;
    efficiency 75 %. Compute shaft power in kW and outlet T.
