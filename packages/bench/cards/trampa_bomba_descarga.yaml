  reason:
    es: 'Una bomba no reduce la presión: 5 → 3 bar da potencia negativa. Es una caída de presión (válvula), no una
      bomba.'
    en: 'A pump cannot lower pressure: 5 → 3 bar gives negative power. This is a pressure drop (valve), not a pump.'
