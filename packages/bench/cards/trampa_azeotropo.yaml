id: trampa_azeotropo
kind: trap
version: v1
title:
  es: Destilado etanol-agua más allá del azeótropo
  en: Ethanol-water distillate past the azeotrope
statement:
  es: Columna a 1 atm (NRTL) alimentada con 100 mol/s de etanol-agua 40/60 % mol. Se pide un destilado con 97 %
    mol de etanol y un fondo con 1 % mol. Calcular el flujo de destilado en mol/s y el reflujo mínimo.
  en: 'Column at 1 atm (NRTL) fed 100 mol/s of ethanol-water 40/60 mol %. Required: distillate 97 mol % ethanol,
    bottoms 1 mol %. Compute distillate flow in mol/s and the minimum reflux.'
