  reason:
    es: 'Un compresor no baja la presión: 10 → 5 bar es una expansión (turbina o válvula). La potencia ''consumida''
      saldría negativa.'
    en: 'A compressor cannot lower pressure: 10 → 5 bar is an expansion (expander or valve). ''Consumed'' power
      would come out negative.'
