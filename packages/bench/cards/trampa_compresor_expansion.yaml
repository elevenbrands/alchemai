expected:
  W_kW:
    value: null
    unit: kW
    tol: {}
  T_out_K:
    value: null
    unit: K
    tol: {}
trap:
  keywords:
  - expan
  - turbina
  - turbine
  - menor
  - below
  - lower
  - negativ
  - no puede
  - cannot
  - válvula
  - valvula
