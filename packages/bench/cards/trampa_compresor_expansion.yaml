id: trampa_compresor_expansion
kind: trap
version: v1
title:
  es: Compresor que baja la presión
  en: Compressor that lowers pressure
statement:
  es: Compresor adiabático, 100 mol/s de gas 85/7/4/2 % C1/C2/C3/nC4 + 2 % CO₂ (Peng-Robinson), entra a 300 K y
    10 bar; presión de descarga especificada 5 bar; η adiabática 75 %. Calcular la potencia consumida en kW y la
    T de descarga.
  en: Adiabatic compressor, 100 mol/s of gas 85/7/4/2 % C1/C2/C3/nC4 + 2 % CO₂ (Peng-Robinson), inlet 300 K and
    10 bar; specified discharge 5 bar; adiabatic η 75 %. Compute power consumed in kW and discharge T.
tags:
