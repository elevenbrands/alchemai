title:
  es: Lazo de reciclo con Wegstein
  en: Recycle loop (Wegstein)
statement:
  es: 10 kg/s de agua fresca a 300 K y 1 atm se mezclan con el reciclo, se calientan a 400 K y un divisor purga 20 % y recicla 80
    %. Flujos de reciclo y purga en estado estacionario y temperatura de la corriente mezclada (salida del mezclador,
    antes del calentador).
  en: 10 kg/s fresh water at 300 K and 1 atm mixes with the recycle, is heated to 400 K and a splitter purges 20 % and recycles 80
    %. Steady-state recycle and purge flows and the temperature of the mixed stream (mixer outlet, before the heater).
