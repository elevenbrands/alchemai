statement:
  es: '¿A qué fracción mol de etanol y a qué temperatura (K) hierve el azeótropo etanol-agua a 1 atm (101325 Pa)?
    Pista: es el mínimo de la curva de burbuja; búscalo con el simulador variando la composición. Elige tú el paquete
    termodinámico adecuado para esta mezcla y nómbralo en las notas.'
  en: 'At what ethanol mole fraction and temperature (K) does the ethanol-water azeotrope boil at 1 atm (101325
    Pa)? Hint: it is the minimum of the bubble curve; search it with the simulator by varying composition. Choose
    the thermodynamic property package yourself and name it in the notes.'
