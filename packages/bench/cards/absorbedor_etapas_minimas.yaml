id: absorbedor_etapas_minimas
kind: design
version: v3
title:
  es: Etapas mínimas de un absorbedor de propano
  en: Minimum stages of a propane absorber
statement:
  es: 100 mol/s de gas (98 % metano, 2 % propano molar) a 300 K y 10 bar entran por el fondo de un absorbedor; por
    el domo entran 120 mol/s de n-decano puro a 300 K y 10 bar. Peng-Robinson, sin caída de presión. Con una columna
    de absorción rigurosa de etapas de equilibrio, ¿cuál es el número mínimo de etapas teóricas que absorbe al menos
    94 % del propano, y qué fracción del propano absorbe con ese número?
  en: 100 mol/s of gas (98 % methane, 2 % propane molar) at 300 K and 10 bar enter the bottom of an absorber; 120
    mol/s of pure n-decane at 300 K and 10 bar enter the top. Peng-Robinson, no pressure drop. With a rigorous equilibrium-stage
    absorption column, what is the minimum number of theoretical stages that absorbs at least 94 % of the propane,
    and what fraction of the propane does it absorb with that number?
tags:
- masa
- absorcion
