id: transporte_dp_tuberia
kind: design
version: v3
title:
  es: Caída de presión en una línea de agua que sube 15 m
  en: Pressure drop in a water line rising 15 m
statement:
  es: 10 kg/s de agua a 20 °C y 5 bar fluyen por 250 m de tubería de acero comercial de 3 in nominal cédula 40 (diámetro
    interno 77.93 mm); la salida está 15 m más arriba que la entrada. ¿Presión de salida (bar), caída de presión
    por fricción (kPa) y velocidad (m/s)?
  en: 10 kg/s of water at 20 °C and 5 bar flow through 250 m of 3 in nominal schedule 40 commercial steel pipe (inner
    diameter 77.93 mm); the outlet is 15 m above the inlet. Outlet pressure (bar), frictional pressure drop (kPa)
    and velocity (m/s)?
