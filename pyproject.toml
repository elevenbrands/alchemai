    "cantera>=3.2.0",
    "chemicals>=1.5.2",
    "fastmcp>=4.1.5",
    "fluids>=1.3.1",
    "ht>=1.2.0",
    "idaes-pse>=2.13.0",
    "matplotlib>=3.11.2",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "omlt>=1.2.2",
    "pandas>=3.1.0",
    "pydexpi>=2.1.0",
    "pytest>=9.2.0",
    "pythonnet>=3.2.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "sfiles2>=1.2.0",
    "thermo>=0.6.1",
]
